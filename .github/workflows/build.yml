name: Build & Zip extension

on:
  push:
    branches: [main]
    # On évite une boucle infinie : le workflow commit lui-même un fichier,
    # donc on ignore les pushs qui ne modifient QUE le zip.
    paths-ignore:
      - "impots-reskin.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Token avec droits d'écriture pour pouvoir push le zip.
          token: ${{ secrets.GITHUB_TOKEN }}
          # On a besoin de l'historique pour pouvoir commit.
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension
        run: pnpm build

      - name: Zip build (overwrite previous)
        run: |
          cd build/chrome-mv3-prod
          zip -r ../../impots-reskin.zip .
          cd -
          ls -la impots-reskin.zip

      - name: Commit zip if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add impots-reskin.zip
          if git diff --staged --quiet; then
            echo "No changes in zip, nothing to commit."
          else
            git commit -m "chore: rebuild extension zip [skip ci]"
            git push
          fi
